name: Build release candidates

"on":
  workflow_dispatch:

permissions: {}

jobs:
  build-candidates:
    needs: windows-2025-production-gate
    runs-on: ubuntu-24.04
    env:
      RELEASE_LPAC_SIGNAL_SCHEMA: "1"
      RELEASE_LPAC_GATE_RESULT: ${{ needs.windows-2025-production-gate.result }}
      RELEASE_LPAC_PROBE_OUTCOME: ${{ needs.windows-2025-production-gate.outputs.lpac-probe-outcome }}
      RELEASE_LPAC_FINISH_OUTCOME: ${{ needs.windows-2025-production-gate.outputs.lpac-finish-outcome }}
      RELEASE_LPAC_TESTED_HEAD_SHA: ${{ needs.windows-2025-production-gate.outputs.lpac-tested-head-sha }}
      RELEASE_LPAC_RUN_ID: ${{ github.run_id }}
      RELEASE_LPAC_RUN_ATTEMPT: ${{ github.run_attempt }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          python-version: "3.12.13"
          enable-cache: false
      - name: Release readiness gate
        run: uv run --no-project --python 3.12.13 python scripts/check_release_readiness.py --mode release
      - name: Synchronize only after readiness succeeds
        run: uv sync --frozen --all-groups
      - name: Re-run release compliance gates
        run: |
          uv run --frozen pytest -q
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen python scripts/check_dependency_policy.py
          uv run --frozen python scripts/check_github_actions_policy.py
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
      - name: Export the frozen runtime closure
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file .pip-audit-requirements.txt
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: .pip-audit-requirements.txt
      - name: Build deterministic source and Skill candidates
        run: uv run --frozen python scripts/build_release_artifacts.py --output-dir dist/release
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: dist/release/academic-pdf-en-zh-reader-source.zip
          format: spdx-json
          output-file: dist/release/source.spdx.json
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: dist/release/academic-pdf-en-zh-reader-skill.zip
          format: spdx-json
          output-file: dist/release/skill.spdx.json
      - name: Reject a development-state marker and hash every candidate
        run: |
          if grep -a -R -F "PUBLIC_RELEASE_BLOCKED" dist/release; then
            exit 1
          fi
          cd dist/release
          sha256sum academic-pdf-en-zh-reader-source.zip academic-pdf-en-zh-reader-skill.zip asset-manifest.json source.spdx.json skill.spdx.json > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidates
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

  windows-2025-production-gate:
    runs-on: windows-2025
    outputs:
      lpac-probe-outcome: ${{ steps.lpac-probe.outcome }}
      lpac-finish-outcome: ${{ steps.lpac-finish.outcome }}
      lpac-tested-head-sha: ${{ steps.lpac-tested-head.outputs.sha }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          enable-cache: false
      - name: Synchronize the frozen environment
        run: uv sync --frozen --all-groups --python "$env:pythonLocation\python.exe"
      - name: Verify the production AppContainer security probe
        id: lpac-probe
        run: uv run --python "$env:pythonLocation\python.exe" --frozen python scripts/probe_worker_sandbox.py
      - name: Complete rendering and QA through the production LPAC boundary
        id: lpac-finish
        run: uv run --python "$env:pythonLocation\python.exe" --frozen pytest -q tests/security/test_finish_worker_boundary.py::test_production_finish_completes_render_and_qa_in_lpac
      - name: Bind the successful live gate to the tested commit
        id: lpac-tested-head
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw 'invalid checked-out commit SHA' }
          "sha=$sha" >> $env:GITHUB_OUTPUT
