name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          python-version: "3.12.13"
          enable-cache: false
      - name: Synchronize the frozen environment
        run: uv sync --frozen --all-groups
      - name: Test
        run: uv run --frozen pytest -q
      - name: Ruff lint
        run: uv run --frozen ruff check .
      - name: Ruff format check
        run: uv run --frozen ruff format --check .
      - name: Dependency and license inventory
        run: uv run --frozen python scripts/check_dependency_policy.py
      - name: Current release-state gate
        run: uv run --frozen python scripts/check_release_readiness.py --mode current
      - name: GitHub Actions policy
        run: uv run --frozen python scripts/check_github_actions_policy.py

  windows-runtime:
    runs-on: windows-2025
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          enable-cache: false
      - name: Build the pinned project-compatible CPython runtime
        run: python scripts/build_compatible_python.py --output-dir .tools/compatible-python
      - name: Synchronize the frozen environment
        run: uv sync --frozen --all-groups --python ".tools/compatible-python/python.exe"
      - name: Build the pinned compatible dependency wheels
        run: python scripts/build_compatible_dependencies.py --output-dir .tools/compatible-dependencies
      - name: Install and record the verified dependency overlay
        run: python scripts/install_compatible_dependencies.py --wheelhouse .tools/compatible-dependencies --python .venv/Scripts/python.exe
      - name: Verify the installed dependency bytes before testing
        run: python scripts/install_compatible_dependencies.py --wheelhouse .tools/compatible-dependencies --python .venv/Scripts/python.exe --verify-only
      - name: Smoke test the restricted Windows worker
        run: uv run --python ".tools/compatible-python/python.exe" --frozen --no-sync pytest -q tests/security/test_windows_worker_limits.py::test_worker_uses_restricted_token_and_enforced_job_limits
      - name: Verify the production AppContainer security probe
        run: uv run --python ".tools/compatible-python/python.exe" --frozen --no-sync python scripts/probe_worker_sandbox.py
      - name: Test the Windows worker and production pipeline
        run: uv run --python ".tools/compatible-python/python.exe" --frozen --no-sync pytest -q

  reuse:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  codeql:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: python
      - if: ${{ github.event.repository.private == true }}
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          upload: never
      - if: ${{ github.event.repository.private == false }}
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          upload: always
